plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
    id 'com.google.firebase.crashlytics'
}

import java.util.Properties

// Читаем local.properties
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

// Пытаемся загрузить keystore.properties
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def haveKeystore = false
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    haveKeystore = true
} else {
    println("⚠️ WARNING: Файл keystore.properties не найден — release-сборка без подписи")
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '2'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '3'

android {
    namespace "com.thedeveloper.stroy_messanger"
    compileSdkVersion 35
    ndkVersion flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    signingConfigs {
        // release-конфиг только если есть keystore.properties
        if (haveKeystore) {
            release {
                keyAlias   keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile   file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
        // debug-конфиг берётся автоматически из debug.keystore
    }

    defaultConfig {
        applicationId "com.thedeveloper.stroy_messanger"
        minSdkVersion 23
        targetSdkVersion 35
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    buildTypes {
        release {
            if (haveKeystore) {
                signingConfig signingConfigs.release
            } else {
                // без keystore — привязка к debug-keystore
                signingConfig signingConfigs.debug
            }
            // по желанию: отключить минификацию и пр.
            // minifyEnabled false
            // proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            // debug-сборка по умолчанию подписывается debug.keystore
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation 'com.android.support:multidex:1.0.3'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}
