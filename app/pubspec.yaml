name: app
description: "GNext logistic application"

publish_to: 'none'

version: 4.8.1+6.8

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  responsive_sizer: ^3.3.0+1
  pinput: ^4.0.0
  cupertino_icons: ^1.0.2
  flutter_slider_drawer: ^2.1.3
  buttons_tabbar: ^1.3.8
  firebase_core: ^3.1.1
  flutter_chat_bubble: ^2.0.2
  firebase_auth: ^5.1.1
  retrofit: '>=4.0.0 <5.0.0'
  json_annotation: ^4.8.1
  motion_toast: ^2.8.0
  firebase_messaging: ^15.0.2
  image_picker: ^1.0.7
  socket_io_client: ^2.0.3+1
  animated_custom_dropdown: ^3.0.0
  bottom_picker: ^2.4.0
  dio: ^5.4.1
  path_provider: ^2.1.3
  geocoding: ^3.0.0
  story: ^1.1.0
  video_player: ^2.8.3
  url_launcher: ^6.2.5
  file_picker: ^8.0.0+1
  fluttertoast: ^8.2.4
  permission_handler: ^11.2.0
  shared_preferences: ^2.2.2
  voice_message_package: ^2.2.1
  audio_waveforms: ^1.0.5
  device_info_plus: ^10.0.1
  flutter_paypal_payment: ^1.0.6
  flutter_bloc: ^7.0.0
  firebase_crashlytics: ^4.0.2
  currency_converter: ^0.0.2
  in_app_purchase: ^3.2.0
  change_app_package_name: ^1.2.0
  flutter_local_notifications: ^17.2.1+2
  flutter_inappwebview: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  json_serializable: ^6.6.2
  flutter_lints: ^2.0.0
  build_runner: ^2.4.8
  retrofit_generator: ^8.1.0
  icons_launcher: ^2.1.7

# Этот блок принудительно решает конфликт версий
dependency_overrides:
  intl: ^0.20.2

flutter:
  generate: true
  assets:
    - assets/
  uses-material-design: true

icons_launcher:
  image_path: "assets/icon.png"
  platforms:
    android:
      image_path: 'assets/icon_border.png'
      adaptive_background_image: 'assets/background.png'
      adaptive_foreground_image: 'assets/icon_foregraund.png'
      adaptive_round_image: 'assets/icon_round.png'
      enable: true
    ios:
      enable: true

flutter_intl:
  enabled: true
  main_locale: ru